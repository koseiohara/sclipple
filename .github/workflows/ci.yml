name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autotools-linux:
    name: Linux x86_64 / ${{ matrix.cc }} / ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        cc:
          - gcc
          - clang
        mode:
          - normal
          - bootstrap
          - out-of-tree

    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang autoconf automake git

      - name: Normal configure build and test
        if: matrix.mode == 'normal'
        run: |
          set -euo pipefail
          ./configure
          make -j"$(nproc)"
          make -j"$(nproc)" check VERBOSE=1
          make clean
          make -j"$(nproc)"

      - name: Bootstrap configure build and test
        if: matrix.mode == 'bootstrap'
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure
          make -j"$(nproc)"
          make -j"$(nproc)" check VERBOSE=1
          make clean
          make -j"$(nproc)"

      - name: Out-of-tree build and test
        if: matrix.mode == 'out-of-tree'
        run: |
          set -euo pipefail
          mkdir build
          cd build
          ../configure
          make -j"$(nproc)"
          make -j"$(nproc)" check VERBOSE=1
          make clean
          make -j"$(nproc)"

  platform:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: Linux arm64
          - os: macos-15
            target: macOS arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake git

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake

      - name: Bootstrap, build, and test
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            jobs="$(sysctl -n hw.ncpu)"
          else
            jobs="$(nproc)"
          fi

          autoreconf -fi
          ./configure
          make -j"$jobs"
          make -j"$jobs" check VERBOSE=1

  distcheck:
    name: distcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake git

      - name: Distcheck
        run: |
          set -euo pipefail
          autoreconf -fi
          ./configure
          make distcheck


