name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate branch, version, and tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release must be run from main." >&2
            exit 1
          fi

          version="$(
            sed -n 's/^AC_INIT(\[sclipple\], \[\([^]]*\)\])$/\1/p' configure.ac
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in configure.ac: $version" >&2
            exit 1
          fi

          tag="v$version"
          commit="$GITHUB_SHA"
          if git rev-parse --quiet --verify "refs/tags/$tag^{commit}" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"

            if [[ "$tag_commit" != "$commit" ]]; then
              echo "Tag $tag already exists at $tag_commit, expected $commit." >&2
              exit 1
            fi

            echo "Tag $tag already points to the intended commit; treating this run as a retry."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake

      - name: Build and test
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
            jobs="$(sysctl -n hw.ncpu)"
          else
            jobs="$(nproc)"
          fi

          autoreconf -fi
          ./configure CFLAGS="-O3"
          make -j"$jobs"
          make -j"$jobs" check VERBOSE=1

          expected="sclipple version $VERSION"
          actual="$(./src/sclipple --version)"

          if [[ "$actual" != "$expected" ]]; then
            echo "Expected: $expected" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          package="sclipple-$VERSION-$TARGET"

          strip src/sclipple

          mkdir -p "package/$package"
          install -m 755 src/sclipple "package/$package/sclipple"
          install -m 644 LICENSE README.md "package/$package/"

          tar -C package -czf "$package.tar.gz" "$package"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: sclipple-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create or resume draft release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Validate packages and create checksums
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          expected=(
            "sclipple-$VERSION-linux-x86_64.tar.gz"
            "sclipple-$VERSION-linux-arm64.tar.gz"
            "sclipple-$VERSION-macos-arm64.tar.gz"
          )

          for file in "${expected[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing release package: $file" >&2
              exit 1
            fi
          done

          sha256sum "${expected[@]}" > SHA256SUMS

      - name: Prepare release introduction
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          sed "s/@VERSION@/$VERSION/g" \
            .github/release-intro.md \
            > dist/release-intro.md

      - name: Create or reuse draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          tag_exists=false
          if git rev-parse --quiet --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"

            if [[ "$tag_commit" != "$COMMIT" ]]; then
              echo "Tag $TAG now points to $tag_commit, expected $COMMIT." >&2
              exit 1
            fi

            tag_exists=true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"

            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG is already published; refusing to modify it." >&2
              exit 1
            fi

            echo "Reusing existing draft release $TAG."
          elif [[ "$tag_exists" == "true" ]]; then
            gh release create "$TAG" \
              --verify-tag \
              --generate-notes \
              --notes-file dist/release-intro.md \
              --draft
          else
            gh release create "$TAG" \
              --target "$COMMIT" \
              --generate-notes \
              --notes-file dist/release-intro.md \
              --draft
          fi

      - name: Upload or replace release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          assets=(
            "dist/sclipple-$VERSION-linux-x86_64.tar.gz"
            "dist/sclipple-$VERSION-linux-arm64.tar.gz"
            "dist/sclipple-$VERSION-macos-arm64.tar.gz"
            "dist/SHA256SUMS"
          )

          gh release upload "$TAG" "${assets[@]}" --clobber

          release_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"

          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            if ! grep -Fx -- "$name" <<< "$release_assets" >/dev/null; then
              echo "Release asset is missing after upload: $name" >&2
              exit 1
            fi
          done

