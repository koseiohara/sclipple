name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch and version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release must be run from main." >&2
            exit 1
          fi

          version="$(
            sed -n 's/^AC_INIT(\[sclipple\], \[\([^]]*\)\])$/\1/p' configure.ac
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in configure.ac: $version" >&2
            exit 1
          fi

          tag="v$version"

          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64

          - os: ubuntu-22.04-arm
            target: linux-arm64

          - os: macos-15
            target: macos-arm64

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake

      - name: Build and test
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
            jobs="$(sysctl -n hw.ncpu)"
          else
            jobs="$(nproc)"
          fi

          autoreconf -fi
          ./configure
          make -j"$jobs"
          bash tests/cli.sh ./src/sclipple

          expected="sclipple version $VERSION"
          actual="$(./src/sclipple --version)"

          if [[ "$actual" != "$expected" ]]; then
            echo "Expected: $expected" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          package="sclipple-$VERSION-$TARGET"

          strip src/sclipple

          mkdir -p "package/$package"
          install -m 755 src/sclipple "package/$package/sclipple"
          install -m 644 LICENSE README.md "package/$package/"

          tar -C package -czf "$package.tar.gz" "$package"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: sclipple-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs:
      - validate
      - build

    runs-on: ubuntu-22.04

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum sclipple-*.tar.gz > SHA256SUMS

      - name: Prepare release introduction
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          sed "s/@VERSION@/$VERSION/g" \
            .github/release-intro.md \
            > dist/release-intro.md

      - name: Create tag and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --target "$COMMIT" \
            --generate-notes \
            --notes "$(cat dist/release-intro.md)" \
            --draft
